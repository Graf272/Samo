<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Статус рейса</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 5px;
}

#widget {
  position: relative;

  width: 350px;
  max-width: 100%;

  aspect-ratio: 16 / 9;

  overflow: hidden;

  border-radius: 16px;

  background: #111;

  font-family: Arial, sans-serif;

  user-select: none;
  -webkit-user-select: none;
}

video {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #111;
}

.top,
.status {

  position: absolute;

  top: 8px;

  z-index: 3;

  padding: 5px 9px;

  border-radius: 8px;

  background: rgba(0,0,0,.62);

  color: white;

  font-size: 12px;

  font-weight: 800;

  letter-spacing: .4px;

  text-shadow: 0 1px 2px #000;
}

.top {
  left: 10px;
}

.status {
  right: 10px;
}

#play {

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  z-index: 5;

  width: 48px;
  height: 48px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.9);

  background: rgba(0,0,0,.65);

  color: white;

  font-size: 22px;

  line-height: 44px;

  text-align: center;
}

#hint {

  position: absolute;

  left: 50%;
  bottom: 7px;

  transform: translateX(-50%);

  z-index: 4;

  color: rgba(255,255,255,.8);

  font-size: 9px;

  white-space: nowrap;

  opacity: 0;

  text-shadow: 0 1px 2px #000;
}

</style>
</head>

<body>

<div id="widget">

  <video
    id="video"
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div
    class="top"
    id="trip">
    РЕЙС №1
  </div>

  <div
    class="status"
    id="status">
    ЗАГРУЗКА
  </div>

  <div id="play">
    ▶
  </div>

  <div id="hint">
    Двойной тап — следующий этап
  </div>

</div>

<script>

const states = [

  {
    name: "ЗАГРУЗКА",
    file: "loading.mp4"
  },

  {
    name: "В ПУТИ",
    file: "full.mp4"
  },

  {
    name: "РАЗГРУЗКА",
    file: "unloading.mp4"
  },

  {
    name: "В ПУТИ",
    file: "empty.mp4"
  }

];

let current = 0;

let lastTap = 0;

const video =
  document.getElementById("video");

const widget =
  document.getElementById("widget");

const trip =
  document.getElementById("trip");

const status =
  document.getElementById("status");

const play =
  document.getElementById("play");

const hint =
  document.getElementById("hint");


function getTrip() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          "dumptruck_shift_v4"
        ) || "{}"
      );

    return Math.max(
      1,
      Number(data.trips || 0) + 1
    );

  } catch (e) {

    return 1;

  }

}


function updateTrip() {

  trip.textContent =
    "РЕЙС №" + getTrip();

}


function startVideo() {

  const promise =
    video.play();

  if (promise) {

    promise
      .then(function() {

        play.style.display = "none";

      })
      .catch(function() {

        play.style.display = "block";

      });

  }

}


function showState(number) {

  current =
    (number + states.length)
    % states.length;

  const state =
    states[current];

  status.textContent =
    state.name;

  video.pause();

  video.src =
    state.file;

  video.load();

  video.currentTime = 0;

  play.style.display =
    "block";

  startVideo();

}


function nextState() {

  showState(
    current + 1
  );

  hint.style.opacity =
    "1";

  setTimeout(function() {

    hint.style.opacity =
      "0";

  }, 900);

}


function handleTap() {

  const now =
    Date.now();

  if (
    now - lastTap < 450
  ) {

    lastTap = 0;

    nextState();

    return;

  }

  lastTap = now;

  if (video.paused) {

    startVideo();

  }

}


widget.addEventListener(
  "click",
  handleTap
);


widget.addEventListener(
  "touchend",
  function(e) {

    e.preventDefault();

    handleTap();

  },
  {
    passive: false
  }
);


video.addEventListener(
  "playing",
  function() {

    play.style.display =
      "none";

  }
);


video.addEventListener(
  "pause",
  function() {

    if (!video.ended) {

      play.style.display =
        "block";

    }

  }
);


video.addEventListener(
  "ended",
  function() {

    play.style.display =
      "block";

  }
);


updateTrip();

showState(0);


setInterval(
  updateTrip,
  1000
);


window.addEventListener(
  "storage",
  updateTrip
);

</script>

</body>
</html>
