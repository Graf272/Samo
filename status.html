<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Статус рейса</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:5px;
}

#widget{
  position:relative;
  width:350px;
  max-width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:16px;
  background:#111;
  font-family:Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.top,
.status{
  position:absolute;
  top:8px;
  z-index:3;
  padding:5px 9px;
  border-radius:8px;
  background:rgba(0,0,0,.62);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.4px;
  text-shadow:0 1px 2px #000;
}

.top{
  left:10px;
}

.status{
  right:10px;
}

#play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;

  width:48px;
  height:48px;

  border-radius:50%;
  border:2px solid rgba(255,255,255,.9);

  background:rgba(0,0,0,.6);

  color:#fff;

  font-size:22px;
  line-height:44px;
  text-align:center;

  opacity:.9;
}

#hint{
  position:absolute;
  left:50%;
  bottom:7px;
  transform:translateX(-50%);

  z-index:4;

  color:rgba(255,255,255,.8);

  font-size:9px;

  white-space:nowrap;

  opacity:0;

  text-shadow:0 1px 2px #000;
}

</style>
</head>

<body>

<div id="widget">

  <video
    id="video"
    muted
    autoplay
    playsinline
    webkit-playsinline
    preload="auto"
    loop>
  </video>

  <div class="top" id="trip">
    РЕЙС №1
  </div>

  <div class="status" id="status">
    ЗАГРУЗКА
  </div>

  <div id="play">
    ▶
  </div>

  <div id="hint">
    Двойной тап — следующий этап
  </div>

</div>


<script>

/* =========================================
   ЭТАПЫ РЕЙСА
========================================= */

const states = [

  {
    name:"ЗАГРУЗКА",
    file:"loading.mp4"
  },

  {
    name:"В ПУТИ",
    file:"full.mp4"
  },

  {
    name:"РАЗГРУЗКА",
    file:"unloading.mp4"
  },

  {
    name:"В ПУТИ",
    file:"empty.mp4"
  }

];


/* =========================================
   ТЕКУЩЕЕ СОСТОЯНИЕ
========================================= */

let current = 0;

let lastTap = 0;


/* =========================================
   ЭЛЕМЕНТЫ
========================================= */

const video =
  document.getElementById("video");

const widget =
  document.getElementById("widget");

const trip =
  document.getElementById("trip");

const status =
  document.getElementById("status");

const play =
  document.getElementById("play");

const hint =
  document.getElementById("hint");


/* =========================================
   НОМЕР РЕЙСА

   БЕРЁМ ТОЧНО ТО ЖЕ ЧИСЛО,
   ЧТО И ОСНОВНОЙ ВИДЖЕТ.

   НИКАКОГО +1 ЗДЕСЬ НЕТ.
========================================= */

function getTrip(){

  try{

    const d =
      JSON.parse(
        localStorage.getItem(
          "dumptruck_shift_v4"
        ) || "{}"
      );

    return Math.max(
      1,
      Number(d.trips || 0)
    );

  }catch(e){

    return 1;

  }

}


/* =========================================
   ОБНОВИТЬ НОМЕР РЕЙСА
========================================= */

function updateTrip(){

  trip.textContent =
    "РЕЙС №" + getTrip();

}


/* =========================================
   ЗАПУСК ВИДЕО
========================================= */

function startVideo(){

  const p =
    video.play();

  if(p){

    p.then(()=>{

      play.style.display =
        "none";

    }).catch(()=>{

      play.style.display =
        "block";

    });

  }

}


/* =========================================
   ПОКАЗАТЬ ЭТАП
========================================= */

function showState(i){

  current =
    (i + states.length)
    % states.length;

  const s =
    states[current];

  status.textContent =
    s.name;

  video.pause();

  video.src =
    s.file;

  video.loop = true;

  video.load();

  video.currentTime = 0;

  play.style.display =
    "block";

  startVideo();

}


/* =========================================
   СЛЕДУЮЩИЙ ЭТАП
========================================= */

function nextState(){

  showState(
    current + 1
  );

  hint.style.opacity =
    "1";

  setTimeout(()=>{

    hint.style.opacity =
      "0";

  },900);

}


/* =========================================
   ДВОЙНОЙ ТАП
========================================= */

function tap(){

  const now =
    Date.now();

  if(
    now - lastTap < 450
  ){

    lastTap = 0;

    nextState();

  }else{

    lastTap = now;

    if(video.paused){

      startVideo();

    }

    setTimeout(()=>{

      if(
        Date.now() - lastTap > 450
      ){

        lastTap = 0;

      }

    },500);

  }

}


/* =========================================
   НАЖАТИЕ
========================================= */

widget.addEventListener(
  "click",
  tap
);


/* =========================================
   TOUCH ДЛЯ MOBLIN / IPHONE
========================================= */

widget.addEventListener(
  "touchend",
  e => {

    e.preventDefault();

    tap();

  },
  {
    passive:false
  }
);


/* =========================================
   ВИДЕО НАЧАЛО ИГРАТЬ
========================================= */

video.addEventListener(
  "playing",
  () => {

    play.style.display =
      "none";

  }
);


/* =========================================
   ВИДЕО ПОСТАВИЛОСЬ НА ПАУЗУ
========================================= */

video.addEventListener(
  "pause",
  () => {

    if(!video.ended){

      play.style.display =
        "block";

    }

  }
);


/* =========================================
   ВИДЕО ЗАКОНЧИЛОСЬ
========================================= */

video.addEventListener(
  "ended",
  () => {

    play.style.display =
      "block";

    startVideo();

  }
);


/* =========================================
   ПЕРВЫЙ ЗАПУСК
========================================= */

updateTrip();

showState(0);


/* =========================================
   ПРОВЕРЯЕМ НОМЕР КАЖДУЮ СЕКУНДУ

   ПОЭТОМУ ЕСЛИ В ОСНОВНОМ
   ВИДЖЕТЕ БЫЛО:

   3 → СТАНЕТ 3
   4 → СТАНЕТ 4
   СБРОС → СТАНЕТ 1
========================================= */

setInterval(
  updateTrip,
  1000
);


/* =========================================
   ЕСЛИ LOCALSTORAGE ИЗМЕНИЛСЯ
========================================= */

window.addEventListener(
  "storage",
  updateTrip
);

</script>

</body>
</html>
